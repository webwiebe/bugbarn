# golangci-lint config for the dead-code soak.
#
# It is deliberately SEPARATE from .golangci.yml. `unused` finds existing dead
# code, so folding it into the main config would either break the build on day
# one or have to be scoped away to nothing. Instead scripts/check-go-soak.sh
# counts what it finds and ratchets the count against a committed baseline that
# may only fall. Enforce-at target is 0, at which point `unused` moves into
# .golangci.yml and this file goes away.
#
# depguard (import boundaries) soaked here from 13 findings to 0 and now lives
# in .golangci.yml, where scripts/check-go-lint.sh fails on any finding.
version: "2"

run:
  timeout: 5m
  tests: true

# Truncation is off. golangci-lint defaults to max-same-issues: 3, which caps
# repeated findings and would make the baseline a count of the cap rather than
# a count of the debt.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: none
  enable:
    - unused # dead code
  exclusions:
    # Same reason as .golangci.yml: vendored Go under node_modules is in
    # `go list ./...` and would make the count depend on whether npm ci ran.
    paths:
      - (^|/)node_modules/
  settings:
