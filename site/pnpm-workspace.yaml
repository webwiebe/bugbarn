# Makes this package its own pnpm root, so pnpm never walks up into a
# pnpm-workspace.yaml in a parent directory (the CI hosts have one in $HOME).
# This is a single package: there is no multi-package workspace in this repo.
allowBuilds:
  esbuild: true
  # sharp ships prebuilt binaries as optional dependencies; its install
  # script only compiles from source as a fallback.
  sharp: false
