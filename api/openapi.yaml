          type: integer
        GroupID:
          type: integer
          format: int64
          nullable: true
        CreatedAt:
          type: string
          format: date-time
        retention_days:
          type: integer
          nullable: true
          description: Per-project event retention window; null inherits the deployment window
        sampling_mode:
          type: string
          enum: ["", "on", "off"]
          description: Per-project event sampling; "" inherits the deployment default

    ProjectWithUsage:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          description: >
            A project, optionally carrying its usage counts. The three count
            fields are present only when the request asked for usage and the
            aggregate succeeded; an absent field means the count is unknown,
            which is deliberately distinct from a count of zero.
          properties:
            issue_count:
              type: integer
              description: Issues recorded for this project.
            event_count:
              type: integer
              description: >
                Events currently retained for this project. Events older than
                the retention window (the project's own retention_days, else
                BUGBARN_EVENT_RETENTION_DAYS, default 30) are expired, so this is
                a live count and not a lifetime total — per-issue lifetime counts
                live on the issue itself. Sampled events still count: this sums
                what each stored event stands for, not how many rows survived.
            log_count:
              type: integer
              description: Log entries currently retained for this project.

    ProjectGroup:
      type: object
