        traceId:
          type: string
        spanId:
          type: string
        user:
          $ref: "#/components/schemas/UserContext"
        breadcrumbs:
          type: array
          items:
            $ref: "#/components/schemas/Breadcrumb"

    Project:
      type: object
      properties:
        ID:
          type: integer
          format: int64
