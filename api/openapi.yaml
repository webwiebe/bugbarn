          type: string
        IssueNumber:
          type: integer
        Fingerprint:
          type: string
        FingerprintMaterial:
          type: string
        FingerprintExplanation:
          type: array
          items:
            type: string
        Title:
          type: string
        NormalizedTitle:
          type: string
        ExceptionType:
          type: string
        Status:
          type: string
          enum: [open, resolved, muted]
        MuteMode:
          type: string
          enum: [until_regression, forever, ""]
        ResolvedAt:
          type: string
          format: date-time
        ReopenedAt:
          type: string
          format: date-time
        LastRegressedAt:
          type: string
          format: date-time
        RegressionCount:
          type: integer
        FirstSeen:
          type: string
          format: date-time
        LastSeen:
          type: string
          format: date-time
        EventCount:
          type: integer
        RepresentativeEvent:
          $ref: "#/components/schemas/EventPayload"
        project_slug:
          type: string

    Event:
      type: object
      properties:
        ID:
          type: string
        IssueID:
          type: string
        Fingerprint:
          type: string
        FingerprintMaterial:
          type: string
        FingerprintExplanation:
          type: array
          items:
            type: string
        ReceivedAt:
          type: string
          format: date-time
        ObservedAt:
          type: string
          format: date-time
        Severity:
          type: string
        Message:
          type: string
        Regressed:
          type: boolean
        Payload:
          $ref: "#/components/schemas/EventPayload"

    EventPayload:
      type: object
      description: Full event payload as captured by the SDK
      properties:
        ingestId:
          type: string
        receivedAt:
          type: string
          format: date-time
        observedAt:
          type: string
          format: date-time
        severity:
          type: string
        message:
          type: string
        exception:
          $ref: "#/components/schemas/Exception"
        resource:
