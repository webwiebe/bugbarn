openapi: 3.1.0
info:
  title: BugBarn API
  description: |
    Self-hosted error tracking, structured logging, and web analytics.

    ## Authentication

    Most endpoints require authentication via one of two methods:

    - **Session cookie** — Log in via `POST /api/v1/login` to receive a `bugbarn_session` cookie.
      State-changing requests (POST, PUT, PATCH, DELETE) must include the `X-BugBarn-CSRF` header
      with the value from the `bugbarn_csrf` cookie.
    - **API key** — Pass a key in the `X-BugBarn-API-Key` header. Keys have scopes:
      `full` (all access), `read` (GET only, no settings/apikeys), or `ingest` (POST to ingest endpoints only).

    Ingest endpoints (`/api/v1/events`, `/api/v1/logs`, `/api/v1/analytics/collect`) use
    wildcard CORS and accept ingest-scoped API keys so browser SDKs can POST from any origin.

    The writer-internal endpoints under `/internal/` (HMAC-signed session and API key
    touch calls between reader and writer pods, and the database export) are not part of
    this API and are not described here.
  version: 1.0.0
  contact:
    name: BugBarn
    url: https://bugbarn.dev

servers:
  - url: https://bugbarn.wiebe.xyz
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: Auth
    description: Login, logout, and session management
  - name: Health
    description: Health checks and runtime configuration
  - name: Ingest
    description: Event, log, and analytics ingestion (wildcard CORS)
  - name: Issues
    description: Grouped error issues
  - name: Events
    description: Individual error events
  - name: Projects
    description: Project management
  - name: Groups
    description: Project groups
  - name: Releases
    description: Release tracking
  - name: Alerts
    description: Alert rules
  - name: Logs
    description: Structured log viewing
  - name: Settings
    description: Project settings
  - name: Source Maps
    description: Source map management
  - name: API Keys
    description: API key management
  - name: Facets
    description: Issue facet discovery
  - name: Analytics
    description: Web analytics queries
  - name: Setup
    description: Project setup and onboarding
  - name: Key Requests
    description: Agent requests for API keys and their approval
  - name: Monitors
    description: Scheduled-job monitors and their check-ins
  - name: Detection
    description: Detection rules for security and metric telemetry
  - name: Telemetry
    description: Host security and metric telemetry, and browser spans
  - name: Aliases
    description: Alternative slugs that resolve to a project
  - name: Admin
    description: Administrative actions

security:
  - sessionCookie: []
  - apiKey: []

paths:
  # ──────────────────────────────────────────────
  # Public / Auth
  # ──────────────────────────────────────────────
  /api/v1/health:
    get:
      operationId: getHealth
      tags: [Health]
      summary: Health check
      security: []
      parameters:
        - name: detail
          in: query
          schema:
            type: string
            enum: ["true", "false"]
          description: Return detailed health including worker and project status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Degraded or unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/version:
    get:
      operationId: getVersion
      tags: [Health]
      summary: Running version
      description: >-
        The release this process is running. `version` is what the deploy
        stated (BUGBARN_VERSION), `commit` and `built` are baked into the
        binary. Deploy smokes compare it with what they rolled out.
      security: []
      responses:
        "200":
          description: The running version
          content:
            application/json:
              schema:
                type: object
                required: [version, commit, built]
                properties:
                  version:
                    type: string
                    example: v0.236.200
                  commit:
                    type: string
                    example: 0123456789abcdef0123456789abcdef01234567
                  built:
                    type: string
                    example: "2026-10-17T12:00:00Z"

  /api/v1/runtime-config:
    get:
      operationId: getRuntimeConfig
      tags: [Health]
      summary: Public runtime configuration for the web frontend
      security: []
      responses:
        "200":
          description: Runtime config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuntimeConfig"

  /api/v1/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate and create a session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          headers:
            Set-Cookie:
              description: Session and CSRF cookies
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  authEnabled:
                    type: boolean
                  username:
                    type: string
        "401":
          description: Invalid credentials
        "429":
          description: Too many login attempts
          headers:
            Retry-After:
              schema:
                type: string

  /api/v1/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Clear session
      description: |
        Deletes the server-side session. For OIDC sessions the refresh token
        is also revoked at the identity provider (best-effort) and the
        response carries `logout_url` — the IdP end-session URL (with
        `id_token_hint`) the frontend should navigate to so the IdP session
        ends too.
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                    example: false
                  logout_url:
                    type: string
                    description: IdP end-session URL to follow (empty for local sessions)

  /api/v1/oidc/backchannel-logout:
    post:
      operationId: oidcBackchannelLogout
      tags: [Auth]
      summary: OIDC Back-Channel Logout 1.0 endpoint
      description: |
        Called server-to-server by the identity provider when a user's IdP
        session ends (logout, admin revocation, suspension). The signed
        `logout_token` is verified against the issuer's JWKS; matching local
        sessions (by `sid`, else by `sub`) are deleted immediately.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [logout_token]
              properties:
                logout_token:
                  type: string
                  description: Signed JWT logout token minted by the IdP
      responses:
        "200":
          description: Matching sessions terminated (also returned when none matched)
        "400":
          description: Invalid logout token
        "429":
          description: Rate limited

  /api/v1/me:
    get:
      operationId: me
      tags: [Auth]
      summary: Get current user info
      security: []
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  authEnabled:
                    type: boolean
                  username:
                    type: string
                  authMethod:
                    type: string
                    enum: [oidc, local]
        "401":
          description: Not authenticated

  # ──────────────────────────────────────────────
  # Ingest (wildcard CORS)
  # ──────────────────────────────────────────────
  /api/v1/events:
    post:
      operationId: ingestEvent
      tags: [Ingest]
      summary: Ingest an error event
      description: |
        Accepts error events from SDKs. Uses wildcard CORS so browser SDKs can POST
        from any origin. Accepts ingest-scoped or full-scoped API keys.

        The response status draws a hard line between accepted and dropped events:

        - **2xx** — accepted: the event was validated and durably queued, and
          will be processed. The body is `IngestAccepted`.
        - **4xx (400, 401, 413)** — dropped permanently: the request is bad and
          will never succeed as-is. Do **not** retry.
        - **429 / 503** — dropped transiently: backpressure or a temporary
          outage. Retry after the `Retry-After` delay.

        Dropped responses carry an `IngestDropped` body whose `retryable` flag
        restates whether retrying the identical request could succeed. Events are
        validated synchronously, so a `202` means the event was genuinely
        accepted rather than queued and later discarded.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/XBugBarnProject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEvent"
      responses:
        "202":
          description: Event accepted — durably queued and will be processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestAccepted"
        "400":
          description: Dropped — malformed event payload (permanent, do not retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestDropped"
        "401":
          description: Dropped — missing or invalid API key (permanent, do not retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestDropped"
        "413":
          description: Dropped — payload exceeds the size limit (permanent, do not retry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestDropped"
        "429":
          description: Dropped — ingest buffer full (transient, retry after Retry-After)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestDropped"
        "503":
          description: Dropped — ingest pipeline unavailable (transient, retry after Retry-After)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestDropped"

  /api/v1/logs:
    post:
      operationId: ingestLogs
      tags: [Ingest]
      summary: Ingest structured logs
      description: |
        Accepts structured log entries. Supports JSON array or NDJSON format.
        Uses wildcard CORS. Requires a project context via API key or X-BugBarn-Project header.
      security:
        - apiKey: []
      parameters:
        - $ref: "#/components/parameters/XBugBarnProject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                logs:
                  type: array
                  items:
                    $ref: "#/components/schemas/LogObject"
          application/x-ndjson:
            schema:
              type: string
              description: Newline-delimited JSON log objects
      responses:
        "204":
          description: Logs accepted
        "400":
          description: Invalid payload or missing project
    get:
      operationId: listLogs
      tags: [Logs]
      summary: List structured logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: level
          in: query
          schema:
            type: string
            enum: [trace, debug, info, warn, error, fatal]
          description: Minimum log level
        - name: q
          in: query
          schema:
            type: string
          description: Full-text search query
        - name: before
          in: query
          schema:
            type: integer
            format: int64
          description: Cursor for pagination (log entry ID)
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs:
                    type: array
                    items:
                      $ref: "#/components/schemas/LogEntry"
                  next_cursor:
                    type: integer
                    format: int64

  /api/v1/analytics/collect:
    post:
      operationId: collectPageView
      tags: [Ingest]
      summary: Collect a page view for web analytics
      description: |
        Accepts page view data from the analytics snippet. Uses wildcard CORS
        for sendBeacon compatibility. No API key required.
      security: []
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Project slug
        - $ref: "#/components/parameters/XBugBarnProject"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewPayload"
      responses:
        "202":
          description: Page view accepted
        "400":
          description: Invalid payload or missing pathname

  # ──────────────────────────────────────────────
  # Analytics JS snippet
  # ──────────────────────────────────────────────
  /analytics.js:
    get:
      operationId: getAnalyticsSnippet
      tags: [Analytics]
      summary: Serve the analytics JavaScript snippet
      security: []
      parameters:
        - name: project
          in: query
          schema:
            type: string
          description: Project slug to embed in the snippet
      responses:
        "200":
          description: JavaScript snippet
          content:
            application/javascript:
              schema:
                type: string

  # ──────────────────────────────────────────────
  # Setup
  # ──────────────────────────────────────────────
  /api/v1/setup/{slug}:
    get:
      operationId: getSetup
      tags: [Setup]
      summary: Get project setup instructions
      description: |
        Returns a plain-text page with integration instructions, API keys,
        and SDK examples for the given project slug. Auto-creates the project
        if it does not exist.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Setup instructions
          content:
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid slug
        "503":
          description: Setup not configured

  # ──────────────────────────────────────────────
  # Issues
  # ──────────────────────────────────────────────
  /api/v1/issues:
    get:
      operationId: listIssues
      tags: [Issues]
      summary: List issues with filtering and pagination
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [last_seen, first_seen, event_count]
          description: Sort order
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, muted, all]
          description: Filter by status
        - name: q
          in: query
          schema:
            type: string
          description: Search query
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: project_slug
          in: query
          schema:
            type: string
          description: Filter by project slug
      responses:
        "200":
          description: List of issues
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      $ref: "#/components/schemas/Issue"
                  hasMore:
                    type: boolean

  /api/v1/issues/sparklines:
    get:
      operationId: issueSparklines
      tags: [Issues]
      summary: Get 24-hour event count sparklines for issues
      parameters:
        - name: ids
          in: query
          required: true
          schema:
            type: string
          description: Comma-separated issue display IDs (e.g. "BW-1,BW-2")
      responses:
        "200":
          description: Sparkline data keyed by display ID
          content:
            application/json:
              schema:
                type: object
                properties:
                  sparklines:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: integer
                      minItems: 24
                      maxItems: 24

  /api/v1/issues/{issueId}:
    get:
      operationId: getIssue
      tags: [Issues]
      summary: Get a single issue by display ID
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200":
          description: Issue detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"
        "404":
          description: Issue not found

  /api/v1/issues/{issueId}/events:
    get:
      operationId: listIssueEvents
      tags: [Issues]
      summary: List events for an issue
      parameters:
        - $ref: "#/components/parameters/issueId"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 25
        - name: before
          in: query
          schema:
            type: integer
            format: int64
          description: Cursor for pagination (event row ID)
      responses:
        "200":
          description: Events for the issue
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"
                  hasMore:
                    type: boolean

  /api/v1/issues/{issueId}/releases:
    get:
      operationId: listIssueReleases
      tags: [Issues]
      summary: Releases an issue occurs in
      description: Counted over the issue's latest events. `sampled_events` says how many were counted.
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200":
          description: Releases with event counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        release:
                          type: string
                        events:
                          type: integer
                        first_seen:
                          type: string
                          format: date-time
                        last_seen:
                          type: string
                          format: date-time
                  sampled_events:
                    type: integer

  /api/v1/issues/{issueId}/resolve:
    post:
      operationId: resolveIssue
      tags: [Issues]
      summary: Resolve an issue
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200":
          description: Issue resolved
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"

  /api/v1/issues/{issueId}/reopen:
    post:
      operationId: reopenIssue
      tags: [Issues]
      summary: Reopen a resolved issue
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200":
          description: Issue reopened
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"

  /api/v1/issues/{issueId}/mute:
    patch:
      operationId: muteIssue
      tags: [Issues]
      summary: Mute an issue
      parameters:
        - $ref: "#/components/parameters/issueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mute_mode]
              properties:
                mute_mode:
                  type: string
                  enum: [until_regression, forever]
      responses:
        "200":
          description: Issue muted
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"

  /api/v1/issues/{issueId}/unmute:
    patch:
      operationId: unmuteIssue
      tags: [Issues]
      summary: Unmute an issue
      parameters:
        - $ref: "#/components/parameters/issueId"
      responses:
        "200":
          description: Issue unmuted
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    $ref: "#/components/schemas/Issue"

  # ──────────────────────────────────────────────
  # Events
  # ──────────────────────────────────────────────
  /api/v1/events/{eventId}:
    get:
      operationId: getEvent
      tags: [Events]
      summary: Get a single event by ID
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Event detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    $ref: "#/components/schemas/Event"
        "404":
          description: Event not found

  /api/v1/events/stream:
    get:
      operationId: streamEvents
      tags: [Events]
      summary: SSE stream of live error events
      description: |
        Server-Sent Events stream that emits new error events as they are processed.
        Polls every 3 seconds and sends keepalive comments every 15 seconds.
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Only emit events after this timestamp (RFC 3339)
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string

  /api/v1/live/events:
    get:
      operationId: listRecentEvents
      tags: [Events]
      summary: List recent live events
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Events after this timestamp (RFC 3339)
        - name: window
          in: query
          schema:
            type: string
          description: Duration window (e.g. "15m", "1h")
      responses:
        "200":
          description: Recent events
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/Event"

  # ──────────────────────────────────────────────
  # Projects
  # ──────────────────────────────────────────────
  /api/v1/projects:
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List all projects
      description: >
        Returns every project. Per-project usage counts are opt-in via
        `usage=true` because computing them aggregates the issues, events and
        log_entries tables in full; callers that only need the project list
        (the project picker, the scope switcher) should omit the parameter.
      parameters:
        - name: usage
          in: query
          required: false
          schema:
            type: string
            enum: ["true"]
          description: >
            Set to `true` to include issue_count, event_count and log_count on
            each project. Expensive; see `usage_available` in the response.
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  projects:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProjectWithUsage"
                  usage_available:
                    type: boolean
                    description: >
                      Present only when `usage=true` was requested. False means
                      the usage aggregate could not be computed, in which case
                      the count fields are absent from every project. Absent
                      counts mean "unknown", never zero.
                  usage_stale:
                    type: boolean
                    description: >
                      Present only when the counts were served from a cached
                      snapshot because a refresh failed. The numbers are real
                      but older than the usual one-minute cache window.
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                slug:
                  type: string
                  description: Auto-generated from name if omitted
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                type: object
                properties:
                  project:
                    $ref: "#/components/schemas/Project"

  /api/v1/projects/pending-count:
    get:
      operationId: getPendingProjectCount
      tags: [Projects]
      summary: Get count of pending projects
      responses:
        "200":
          description: Pending project count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  slugs:
                    type: array
                    items:
                      type: string

  /api/v1/projects/{slug}:
    put:
      operationId: renameProject
      tags: [Projects]
      summary: Rename a project
      parameters:
        - $ref: "#/components/parameters/projectSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug]
              properties:
                name:
                  type: string
                slug:
                  type: string
      responses:
        "200":
          description: Project renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
    delete:
      operationId: deleteProject
      tags: [Projects]
      summary: Delete a project and all its data
      parameters:
        - $ref: "#/components/parameters/projectSlug"
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/v1/projects/{slug}/approve:
    post:
      operationId: approveProject
      tags: [Projects]
      summary: Approve a pending project
      parameters:
        - $ref: "#/components/parameters/projectSlug"
      responses:
        "200":
          description: Project approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /api/v1/projects/{slug}/limits:
    put:
      operationId: updateProjectLimits
      tags: [Projects]
      summary: Set a project's event retention window and sampling mode
      description: >
        Volume policy for one project. `retention_days` is null to inherit the
        deployment-wide window (`BUGBARN_EVENT_RETENTION_DAYS`) and is clamped to
        it — the global retention sweep expires anything older regardless, so a
        longer value cannot be honoured. `sampling_mode` is "" to inherit the
        deployment default, "on", or "off"; when sampling applies, an issue
        stores every event until it reaches the threshold
        (`BUGBARN_EVENT_SAMPLE_AFTER`) and one event in K past it, K climbing a
        decade at a time. Event counts remain exact either way.
      parameters:
        - $ref: "#/components/parameters/projectSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retention_days:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Days to keep events, or null to inherit the deployment window
                sampling_mode:
                  type: string
                  enum: ["", "on", "off"]
                  description: Event sampling for this project
      responses:
        "200":
          description: Limits updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  retention_days:
                    type: integer
                    nullable: true
                  sampling_mode:
                    type: string
                  clamped:
                    type: boolean
                    description: True when retention_days was reduced to the deployment window
        "400":
          description: Invalid retention window or sampling mode
        "404":
          description: Project not found

