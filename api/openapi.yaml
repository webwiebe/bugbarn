          additionalProperties: true
        attributes:
          type: object
          additionalProperties: true
        traceId:
          type: string
        spanId:
          type: string
        sdkName:
          type: string
        fingerprint:
          type: string
        fingerprintMaterial:
          type: string
        fingerprintExplanation:
          type: array
