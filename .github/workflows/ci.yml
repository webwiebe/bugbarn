name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Fail fast across re-pushes: a newer commit on the same ref cancels the
# in-flight run instead of letting it finish and queue behind the new one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
      - name: Install spec tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install PyYAML
      - name: Spec checks
        shell: bash
        run: |
          set -euo pipefail
          . .ci-venv/bin/activate
          make spec-check

  # Go build/vet/test runs inside BuildKit so the compile cache is shared across
  # both build machines via a registry (GHCR) cache. The `deps` stage pre-compiles
  # the heavy dependency closure (modernc/sqlite -> libc) into a go.sum-keyed
  # layer; mode=max exports it, so whichever runner picks up the job starts warm
  # instead of recompiling SQLite cold (~10 min before). Native arm64 — no QEMU.
  go:
    runs-on: [self-hosted, build]
    permissions:
      contents: read
      packages: write
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          # Persist a named builder across runs so the buildkit container is
          # created once per machine and reused. Avoids the ~1-3 min per-run cost
          # of creating a fresh docker-container builder (image pull + bootstrap),
          # which otherwise dwarfs the ~12s cached build.
          name: bugbarn-ci
          cleanup: false
      - name: GHCR auth
        shell: bash
        run: |
          set -euo pipefail
          DOCKER_CONFIG_DIR="${RUNNER_TEMP}/docker-config-${GITHUB_RUN_ID}"
          mkdir -p "$DOCKER_CONFIG_DIR"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' \
            "$(printf '%s:%s' '${{ github.actor }}' '${{ secrets.GITHUB_TOKEN }}' | base64)" \
            > "$DOCKER_CONFIG_DIR/config.json"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG_DIR" >> "$GITHUB_ENV"
      - name: Go build, vet, test (registry-cached via BuildKit)
        shell: bash
        run: |
          set -euo pipefail
          CACHE_REF="ghcr.io/webwiebe/bugbarn/buildcache"
          docker buildx build \
            --platform linux/arm64 \
            --target test \
            -f deploy/docker/service.Dockerfile \
            --cache-from "type=registry,ref=${CACHE_REF}" \
            --cache-to "type=registry,ref=${CACHE_REF},mode=max" \
            --output type=cacheonly \
            .

  # One leg per Node package (dashboard, marketing site, TS SDK) so they install
  # and build in parallel instead of serially.
  #
  # `tests` is spelled out per package rather than hidden behind
  # `npm run test --if-present`: a missing script used to read exactly like a
  # clean package. site is the only package with no test suite — it is an Astro
  # content site whose whole check surface is `astro check` plus the build.
  node:
    strategy:
      fail-fast: true
      matrix:
        include:
          - dir: "web"
            tests: "yes"
          - dir: "site"
            tests: "no"
          - dir: "sdks/typescript"
            tests: "yes"
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Node lint, test, build (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run lint
          if [ "${{ matrix.tests }}" = "yes" ]; then
            npm run test
          fi
          npm run build
      - name: Frontend duplication (web only)
        if: ${{ matrix.dir == 'web' }}
        working-directory: web
        shell: bash
        run: npx --yes jscpd@latest .
      # TypeScript size/complexity soak. Runs here, not in the quality job,
      # because it needs the web/node_modules this job just installed.
      - name: TypeScript budget soak (web only)
        if: ${{ matrix.dir == 'web' }}
        shell: bash
        run: sh scripts/check-ts-budget.sh

  python:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
      - name: Python checks (sdks/python)
        working-directory: sdks/python
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install --upgrade pip
          # Pinned: an unpinned install means a new ruff release changes
          # what CI enforces with no commit on our side, and it silently
          # diverged from the Woodpecker pipeline, which already pins 0.16.0.
          python -m pip install build pytest 'ruff==0.16.0'
          if [ -f pyproject.toml ]; then
            python -m pip install -e .
          fi
          if find . \( -name 'test_*.py' -o -name '*_test.py' -o -path '*/tests/*.py' \) -print -quit | grep -q .; then
            PYTHONPATH=src python -m pytest
          fi
          if find . -name '*.py' -print -quit | grep -q .; then
            python -m ruff check .
          fi
          if [ -f pyproject.toml ]; then
            python -m build
          fi

  php:
    runs-on: [self-hosted, build]
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
      # The PHP toolchain comes from a pinned container, not from the runner.
      # This step used to `exit 0` when php or composer were missing — and
      # neither is installed on the build agent, so the PHP SDK had not been
      # tested at all while the job reported green. There is now no path
      # through this step that skips the tests.
      - name: PHP checks (sdks/php)
        working-directory: sdks/php
        shell: bash
        run: |
          set -euo pipefail
          command -v docker >/dev/null 2>&1 || { echo "FAIL: docker is required to run the PHP SDK tests"; exit 1; }
          docker run --rm -v "$(pwd):/app" -w /app composer:2.8 \
            sh -c 'set -eu; composer install --no-interaction --prefer-dist; ./vendor/bin/phpunit'

  # Code-quality gates. Runs on the runner (not in Docker) so golangci-lint can
  # use full git history for diff-mode and the coverage profile can escape the
  # build. Parallel to the Docker `go` job, which stays the source of truth for
  # build/vet/test pass-fail.
  quality:
    runs-on: [self-hosted, build]
    env:
      HOME: /Users/wiebe
      PATH: /Users/wiebe/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
      # The runners share $HOME across machines; Go caches on that share have
      # repeatedly served truncated module files (typecheck "EOF" failures)
      # even after re-download + go mod verify passed. Keep every Go/lint
      # cache on the machine-local /tmp instead — cold runs re-download and
      # recompile once per machine, then stay warm.
      GOMODCACHE: /tmp/bugbarn-ci/gomodcache
      GOCACHE: /tmp/bugbarn-ci/gocache
      GOLANGCI_LINT_CACHE: /tmp/bugbarn-ci/golangci-lint
    steps:
      # Go writes its module cache read-only; if a prior run left one inside a
      # workspace, the next checkout cannot clean it (EACCES on unlink). Clear
      # any such leftover across this machine's runner instances before checkout.
      # Go caches now live under $HOME (default), so this is a no-op going forward.
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0          # diff-mode lint needs the merge base
      - name: Heal corrupted Go module cache entries
        shell: bash
        run: sh scripts/heal-go-modcache.sh
      # The gates' own tests run first: a gate that has stopped failing must be
      # reported before the gates it protects are trusted.
      - name: Gate script tests
        shell: bash
        run: sh scripts/gates_test.sh
      - name: File-length gate (all languages)
        shell: bash
        run: sh scripts/check-file-length.sh
      # Full-tree ratchet on every event plus a diff-scoped run on pull
      # requests. This used to be the diff-scoped half only, run
      # unconditionally, so on a push to main it compared main to itself and
      # passed without reading a line. The golangci-lint version now lives in
      # scripts/ensure-golangci.sh, shared with the Woodpecker pipeline, which
      # had drifted to a different pin and therefore a different linter set.
      - name: golangci-lint (full-tree ratchet + diff-scoped)
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.base_ref || '' }}"
          if [ -n "$BASE" ]; then
            git fetch --no-tags origin "$BASE:refs/remotes/origin/$BASE"
          fi
          sh scripts/check-go-lint.sh
      - name: Dead-code and boundary soaks
        shell: bash
        run: sh scripts/check-go-soak.sh
      - name: Go coverage ratchet
        shell: bash
        run: sh scripts/check-coverage.sh
      - name: Duplication scan (jscpd)
        shell: bash
        run: npx --yes jscpd@latest .
