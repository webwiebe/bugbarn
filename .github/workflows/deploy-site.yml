name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, build]
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - name: Reclaim workspaces (clear read-only Go cache from prior runs)
        shell: bash
        run: |
          for c in "$HOME"/github-runners/*/_work/bugbarn/bugbarn/.cache; do
            [ -d "$c" ] || continue
            chmod -R u+w "$c" 2>/dev/null || true
            rm -rf "$c" 2>/dev/null || true
          done
      - uses: actions/checkout@v6

      # setup-node's pnpm cache needs pnpm on PATH before it runs.
      - name: Put pnpm on PATH
        shell: bash
        run: |
          . scripts/use-pnpm.sh
          echo "$GITHUB_WORKSPACE/.tools/corepack-bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site

      - name: Copy docs into content collection
        run: |
          mkdir -p site/src/content/docs
          cp -r docs/. site/src/content/docs/

      - name: Build
        run: pnpm run build
        working-directory: site

      - uses: actions/configure-pages@v5

      # upload-pages-artifact uses GNU tar (`gtar`) to create the Pages bundle.
      # macOS self-hosted runners provide BSD tar as `tar`, so ensure GNU tar is
      # available before invoking the action.
      - name: Ensure GNU tar for Pages artifact
        run: |
          if ! command -v gtar >/dev/null 2>&1; then
            brew install gnu-tar
          fi
          gtar --version

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist/

  deploy:
    needs: build
    runs-on: [self-hosted, build]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
