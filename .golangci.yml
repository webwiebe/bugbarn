# golangci-lint v2 configuration.
#
# Posture: in CI we run with --new-from-rev so only issues introduced by a PR
# fail the build (existing debt is tolerated, new debt is blocked). Thresholds
# are tuned to catch genuine offenders without drowning the team; tighten
# funlen to 60/40 once the Phase B refactor pays down the backlog.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # correctness defaults
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unconvert
    - misspell
    - revive
    # the complexity / size / duplication asks
    - gocyclo      # cyclomatic complexity
    - gocognit     # cognitive complexity
    - funlen       # function length
    - lll          # line length
    - dupl         # Go duplication (jscpd owns the other languages)
    # architectural import boundaries. Zero-tolerance: scripts/check-go-lint.sh
    # fails on any depguard finding, outside the shared count ratchet, so a new
    # boundary violation cannot hide behind an unrelated fix.
    - depguard
  settings:
    gocyclo:
      min-complexity: 12
    gocognit:
      min-complexity: 18
    funlen:
      lines: 60
      statements: 40
    lll:
      # 135 still accommodates inline SQL and OTel-style signatures while
      # catching runaway lines.
      line-length: 135
      tab-width: 1
    dupl:
      threshold: 120
    misspell:
      locale: US
    errcheck:
      # Closing a *sql.Rows / rolling back a deferred *sql.Tx are idiomatically
      # unchecked in Go; checking them adds noise without catching real bugs.
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.Tx).Rollback
        - (*database/sql.Stmt).Close
    revive:
      rules:
        - name: unreachable-code
        - name: empty-block
    depguard:
      # The layering CLAUDE.md already documents as an architecture rule:
      # "Storage wraps DB errors into apperr types. Services log errors and pass
      # through. API maps apperr codes to HTTP status codes. Never leak
      # sql.ErrNoRows or raw DB errors past the storage layer." Nothing enforced
      # it. Test files are exempt: integration tests legitimately wire the real
      # store up to the real handlers.
      rules:
        api-storage-boundary:
          files:
            - "**/internal/api/**"
            # compose.go is the API layer's composition root: it turns the
            # store into services. CLAUDE.md names cmd/ and internal/api as the
            # only composition points; every handler goes through a service.
            - "!**/internal/api/compose.go"
            - "!$test"
          deny:
            - pkg: github.com/wiebe-xyz/bugbarn/internal/storage
              desc: "the API layer must go through internal/service, not reach into internal/storage"
        sql-outside-storage:
          files:
            - "**/internal/**"
            - "!**/internal/storage/**"
            # The storage layer of the telemetry side files (security.db,
            # metrics.db); it wraps DB errors into apperr like storage does.
            - "!**/internal/telemetrydb/**"
            - "!$test"
          deny:
            - pkg: database/sql
              desc: "only internal/storage may touch database/sql; everything else takes a repository interface"
            - pkg: modernc.org/sqlite
              desc: "only internal/storage may bind the sqlite driver"
        # Dependencies point down: api -> service -> storage. Storage owns the
        # DB error domain and never reaches back up into the layers that call it.
        storage-points-down:
          files:
            - "**/internal/storage/**"
            - "**/internal/telemetrydb/**"
            - "!$test"
          deny:
            - pkg: github.com/wiebe-xyz/bugbarn/internal/api
              desc: "storage is the bottom layer; it may not import the API layer"
            - pkg: github.com/wiebe-xyz/bugbarn/internal/service
              desc: "storage is the bottom layer; it may not import the service layer"
        # Only cmd/ and internal/api compose services into a running server.
        # A service that imports the API layer, or any process entrypoint,
        # becomes a second composition point.
        service-does-not-compose:
          files:
            - "**/internal/service/**"
            - "!$test"
          deny:
            - pkg: github.com/wiebe-xyz/bugbarn/internal/api
              desc: "services are composed by cmd/ and internal/api; they may not import the API layer"
            - pkg: github.com/wiebe-xyz/bugbarn/cmd
              desc: "services may not import a process entrypoint"
        # domain, apperr and event are the shared vocabulary every layer
        # imports, so they import nothing from internal/ themselves. domain may
        # use the event type: event is itself a leaf.
        # Strict: anything not on the allow list is denied.
        leaf-packages:
          list-mode: strict
          files:
            - "**/internal/domain/**"
            - "**/internal/apperr/**"
            - "**/internal/event/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/wiebe-xyz/bugbarn/internal/event
        # Dogfooding: internal/selflog only sees records that go through slog.
        # A stdlib log call at error level never reaches BugBarn's own dashboard.
        no-stdlib-log:
          files:
            - $all
          deny:
            - pkg: log$
              desc: "use log/slog; selflog only reports what goes through slog"
  exclusions:
    generated: lax
    # Vendored third-party Go inside node_modules (web/node_modules/flatted/
    # golang/...) is part of `go list ./...`, so it was linted whenever a node
    # step had already run `npm ci` and not otherwise. That made the finding
    # count depend on step ordering: 106 on a CI runner with no node_modules,
    # 110 on a tree that had them. scripts/check-coverage.sh carries the same
    # exclusion for the same reason.
    paths:
      - (^|/)node_modules/
    rules:
      # Table-driven tests are legitimately long and repetitive, and routinely
      # ignore cleanup (deferred Close) errors.
      - path: _test\.go
        linters:
          - funlen
          - gocyclo
          - gocognit
          - dupl
          - lll
          - errcheck
      # Complexity of the process entrypoints is tolerated (bootstrap wiring that
      # doesn't decompose cleanly). Scoped to main.go/reader.go only, so the rest
      # of cmd/bugbarn — notably worker.go's hot loop — is gated like any other
      # package and its complexity can't silently regrow.
      - path: cmd/bugbarn/(main|reader)\.go$
        linters:
          - funlen
          - gocyclo
          - gocognit
      # Long signatures/log lines and deferred resource Close() at shutdown are
      # idiomatic across all of cmd/bugbarn's process wiring.
      - path: cmd/bugbarn/
        linters:
          - lll
          - errcheck
