apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# layer7, the production node. Ships to the production readers in-cluster.
# secret.yaml (SOPS) is applied by the pipeline, never through Kustomize.
resources:
  - ../base
configMapGenerator:
  - name: vector-config
    namespace: vector
    behavior: merge
    files:
      - sinks.yaml
