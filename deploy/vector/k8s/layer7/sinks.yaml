# layer7 ships to production in-cluster.
# Keep in step with the testing/prod blocks in ../k3s1/sinks.yaml.
sinks:
  security:
    type: http
    inputs: [auth_filter, audit_tag, traefik_tag]
    uri: http://bugbarn.bugbarn-production.svc.cluster.local:8080/api/v1/telemetry/security
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    # Below BugBarn's 1MiB ingest body limit.
    batch: {max_bytes: 900000, timeout_secs: 10}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}

  metrics:
    type: http
    inputs: [host_tag]
    uri: http://bugbarn.bugbarn-production.svc.cluster.local:8080/api/v1/telemetry/metrics
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    batch: {max_bytes: 900000, timeout_secs: 30}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}
