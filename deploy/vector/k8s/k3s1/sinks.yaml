# k3s1 + k3s2 ship to the testing monolith in-cluster (end-to-end checks) and
# to production over the public endpoint (Hosts and Security views), the
# latter with the vector-hosts key in prod_api_key. Keep in step with
# ../layer7/sinks.yaml.
sinks:
  security:
    type: http
    inputs: [auth_filter, audit_tag, traefik_tag]
    uri: http://bugbarn.bugbarn-testing.svc.cluster.local:8080/api/v1/telemetry/security
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    # Below BugBarn's 1MiB ingest body limit.
    batch: {max_bytes: 900000, timeout_secs: 10}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}

  metrics:
    type: http
    inputs: [host_tag]
    uri: http://bugbarn.bugbarn-testing.svc.cluster.local:8080/api/v1/telemetry/metrics
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    batch: {max_bytes: 900000, timeout_secs: 30}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}

  security_prod:
    type: http
    inputs: [auth_filter, audit_tag, traefik_tag]
    uri: https://bugbarn.wiebe.xyz/api/v1/telemetry/security
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.prod_api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    batch: {max_bytes: 900000, timeout_secs: 10}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}

  metrics_prod:
    type: http
    inputs: [host_tag]
    uri: https://bugbarn.wiebe.xyz/api/v1/telemetry/metrics
    encoding: {codec: json}
    framing: {method: newline_delimited}
    request:
      headers:
        x-bugbarn-api-key: "SECRET[bugbarn.prod_api_key]"
        content-type: application/x-ndjson
      timeout_secs: 30
    batch: {max_bytes: 900000, timeout_secs: 30}
    buffer: {type: disk, max_size: 268435488, when_full: drop_newest}
