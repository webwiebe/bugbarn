apiVersion: apps/v1
kind: Deployment
metadata:
  name: oomwatch
  namespace: oomwatch
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # One watcher per cluster. A second replica would report every kill twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oomwatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oomwatch
    spec:
      serviceAccountName: oomwatch
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: oomwatch
          image: bugbarn/service
          imagePullPolicy: IfNotPresent
          args: [oomwatch]
          env:
            - name: GOMEMLIMIT
              value: 72MiB
            - name: OOMWATCH_INTERVAL
              value: 30s
            - name: OOMWATCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: oomwatch-secrets
                  key: api_key
            # OOMWATCH_ENDPOINT, OOMWATCH_CLUSTER and OOMWATCH_PROJECTS come
            # from the overlay.
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
