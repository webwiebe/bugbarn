apiVersion: v1
kind: Namespace
metadata:
  name: oomwatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oomwatch
  namespace: oomwatch
---
# Read-only: the watcher lists pods in every namespace and changes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oomwatch
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oomwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: oomwatch
subjects:
  - kind: ServiceAccount
    name: oomwatch
    namespace: oomwatch
