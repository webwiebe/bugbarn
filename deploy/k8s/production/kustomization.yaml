apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bugbarn-production
resources:
  - namespace.yaml
  - pvc.yaml
  - writer-deployment.yaml
  - writer-service.yaml
  - reader-deployment.yaml
  - reader-service.yaml
  - reader-hpa.yaml
  - redis-queue-deployment.yaml
  - redis-queue-service.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - ingest-ingress.yaml
  - ingest-forward-domains.yaml
  - cronjob-settings-snapshot.yaml
images:
  - name: bugbarn/service
    newName: ghcr.io/webwiebe/bugbarn/service
    newTag: local
  - name: bugbarn/web
    newName: ghcr.io/webwiebe/bugbarn/web
    newTag: local
patches:
  # The deploy replaces __VERSION__ (testing: main-<sha7>, staging and production:
  # the release tag). It lives in the pod spec so the pods roll when only the
  # version changes.
  - target:
      kind: Deployment
      name: bugbarn-writer
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BUGBARN_VERSION
          value: "__VERSION__"
  - target:
      kind: Deployment
      name: bugbarn-reader
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: BUGBARN_VERSION
          value: "__VERSION__"
