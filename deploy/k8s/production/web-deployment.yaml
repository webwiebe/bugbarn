apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugbarn-web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bugbarn-web
      app.kubernetes.io/environment: production
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bugbarn-web
        app.kubernetes.io/environment: production
    spec:
      # ssd2 holds the data volumes (k3s-infra#213). The node is tainted for
      # remote workloads and labelled for the WAN link.
      nodeSelector:
        topology.wiebe.xyz/link: wan
      tolerations:
        - key: node-role.wiebe.xyz/remote
          operator: Equal
          value: "true"
          effect: NoSchedule
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: bugbarn-web
          image: bugbarn/web
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: bugbarn-packages
              mountPath: /srv/packages
      volumes:
        - name: bugbarn-packages
          persistentVolumeClaim:
            claimName: bugbarn-packages-ssd2
