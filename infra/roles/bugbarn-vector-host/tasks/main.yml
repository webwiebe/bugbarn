---
# Installs the BugBarn host Vector agent (deploy/vector/host): host metrics and
# sshd/sudo logs to production BugBarn. macOS gets a per-user LaunchAgent,
# Linux the Vector deb and its systemd service. The ingest key is decrypted
# from SOPS on the control machine, so it only lands in the agent's 0600
# secrets file.

- name: Decrypt the host ingest key
  ansible.builtin.command:
    argv:
      - sops
      - -d
      - --extract
      - '["stringData"]["api_key"]'
      - "{{ bugbarn_vector_repo }}/deploy/vector/host/secret.yaml"
  environment:
    SOPS_AGE_KEY_FILE: "{{ bugbarn_vector_age_key_file }}"
  delegate_to: localhost
  register: bugbarn_vector_key
  changed_when: false
  no_log: true

- name: Install on macOS
  ansible.builtin.include_tasks: macos.yml
  when: ansible_facts.system == "Darwin"

- name: Install on Linux
  ansible.builtin.include_tasks: linux.yml
  when: ansible_facts.system == "Linux"
