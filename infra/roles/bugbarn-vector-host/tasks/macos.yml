---
# Per-user LaunchAgent through deploy/vector/host/macos/install.sh; no root.

- name: Create the installer staging dir
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.vector/install"
    state: directory
    mode: "0755"

- name: Copy the installer and config
  ansible.builtin.copy:
    src: "{{ bugbarn_vector_repo }}/deploy/vector/host/macos/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.vector/install/{{ item }}"
    mode: "{{ '0755' if item.endswith('.sh') else '0644' }}"
  loop:
    - install.sh
    - vector.yaml
  register: bugbarn_vector_files

- name: Check the agent is loaded
  ansible.builtin.command: launchctl print "gui/{{ ansible_facts.user_uid }}/xyz.wiebe.bugbarn.vector"
  register: bugbarn_vector_loaded
  changed_when: false
  failed_when: false

# install.sh pins the Vector version, validates the config and reloads the
# LaunchAgent; run it on a new host or when the files changed.
- name: Install or upgrade the agent
  when: bugbarn_vector_files.changed or bugbarn_vector_loaded.rc != 0
  block:
    - name: Create the secrets dir
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.vector/secrets"
        state: directory
        mode: "0700"

    - name: Write the ingest key
      ansible.builtin.shell:
        cmd: umask 077; cat > "{{ ansible_facts.env.HOME }}/.vector/secrets/api_key"
        stdin: "{{ bugbarn_vector_key.stdout }}"
        stdin_add_newline: false
      no_log: true

    # With nothing on stdin, install.sh keeps the key written above. Vector loads
    # the key to validate the config, so the output stays in memory and goes to no
    # file: a plaintext key does not go on disk beyond the agent's own key file.
    - name: Run the installer
      ansible.builtin.shell:
        cmd: '"{{ ansible_facts.env.HOME }}/.vector/install/install.sh" < /dev/null 2>&1'
      register: bugbarn_vector_install
      failed_when: false
      no_log: true

    # Prints only the text in this list, never a line of the output: a wrapped,
    # encoded or partial copy of the key would pass any replacement.
    - name: Report a failed install
      ansible.builtin.fail:
        msg: >-
          install.sh exited {{ bugbarn_vector_install.rc }}.
          {{ 'Recognised: ' ~ (bugbarn_vector_install_found | join('; ')) if bugbarn_vector_install_found
          else 'No known step line matched. To see the output, run this in a terminal on the host: "'
          ~ ansible_facts.env.HOME ~ '/.vector/install/install.sh" < /dev/null' }}
      when: bugbarn_vector_install.rc != 0
      vars:
        bugbarn_vector_install_found: >-
          {{ bugbarn_vector_install_steps
          | selectattr('match', 'in', bugbarn_vector_install.stdout)
          | map(attribute='says') | list }}
        bugbarn_vector_install_steps:
          - {match: "unsupported architecture", says: "install.sh does not support this architecture"}
          - {match: "no API key", says: "install.sh found no key in the secrets file"}
          - {match: "curl:", says: "curl failed to download Vector"}
          - {match: "tar:", says: "tar failed to unpack Vector"}
          - {match: "install:", says: "the Vector binary could not be installed"}
          - {match: "Failed to load", says: "vector validate rejected the config"}
          - {match: "Bootstrap failed: 5:", says: "launchctl bootstrap failed with 5"}
          - {match: "Bootstrap failed: 125:", says: "launchctl bootstrap failed with 125"}
          - {match: "Bootstrap failed", says: "launchctl bootstrap failed"}
          - {match: "not found", says: "a command or file was not found"}
          - {match: "Permission denied", says: "permission denied on a file"}
