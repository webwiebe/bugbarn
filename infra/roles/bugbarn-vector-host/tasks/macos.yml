---
# Per-user LaunchAgent through deploy/vector/host/macos/install.sh; no root.

- name: Create the installer staging dir
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.vector/install"
    state: directory
    mode: "0755"

- name: Copy the installer and config
  ansible.builtin.copy:
    src: "{{ bugbarn_vector_repo }}/deploy/vector/host/macos/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.vector/install/{{ item }}"
    mode: "{{ '0755' if item.endswith('.sh') else '0644' }}"
  loop:
    - install.sh
    - vector.yaml
  register: bugbarn_vector_files

- name: Check the agent is loaded
  ansible.builtin.command: launchctl print "gui/{{ ansible_facts.user_uid }}/xyz.wiebe.bugbarn.vector"
  register: bugbarn_vector_loaded
  changed_when: false
  failed_when: false

# install.sh pins the Vector version, validates the config and reloads the
# LaunchAgent; run it on a new host or when the files changed.
- name: Install or upgrade the agent
  when: bugbarn_vector_files.changed or bugbarn_vector_loaded.rc != 0
  block:
    - name: Create the secrets dir
      ansible.builtin.file:
        path: "{{ ansible_facts.env.HOME }}/.vector/secrets"
        state: directory
        mode: "0700"

    - name: Write the ingest key
      ansible.builtin.shell:
        cmd: umask 077; cat > "{{ ansible_facts.env.HOME }}/.vector/secrets/api_key"
        stdin: "{{ bugbarn_vector_key.stdout }}"
        stdin_add_newline: false
      no_log: true

    # With nothing on stdin, install.sh keeps the key written above. Vector loads
    # the key to validate the config, so its output stays hidden until the next
    # task has masked the key.
    - name: Run the installer
      ansible.builtin.shell:
        cmd: '"{{ ansible_facts.env.HOME }}/.vector/install/install.sh" < /dev/null'
      register: bugbarn_vector_install
      failed_when: false
      no_log: true

    - name: Report a failed install
      ansible.builtin.fail:
        msg: >-
          install.sh exited {{ bugbarn_vector_install.rc }}:
          {{ (bugbarn_vector_install.stdout ~ '\n' ~ bugbarn_vector_install.stderr)
          | replace(bugbarn_vector_key.stdout, '[key]') }}
      when: bugbarn_vector_install.rc != 0
