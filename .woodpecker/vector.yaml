# Vector agents (deploy/vector): checks on a PR, deploys the DaemonSet to both
# clusters when a change to deploy/vector lands on main. Independent of the
# BugBarn release chain: the agents only need the telemetry endpoints to exist,
# and their disk buffers hold events while BugBarn is unreachable.
# NB: local backend = one shell per `commands` entry, and Woodpecker pre-
# substitutes braced variables; so each step is ONE block and all vars use $VAR.
when:
  - event: pull_request
    path:
      include: ['deploy/vector/**', '.woodpecker/vector.yaml']
  - event: push
    branch: main
    path:
      include: ['deploy/vector/**', '.woodpecker/vector.yaml']
  - event: manual

labels:
  type: build

# The clone token is the one Woodpecker bakes into the pipeline when it is
# created, and Gitea gives it a one hour life. Woodpecker refreshes it only when
# a pipeline is created after it expired, so a pipeline created in the last
# seconds of its life carries a token that dies before a later workflow clones
# (#202: tag pipeline 704 created 15:08:58, token expired ~15:09:25, release
# cloned at 15:08:59, tag-check and deploy-production at 15:09:50 and got a 401).
# The default clone may therefore fail; `clone-fallback` then clones with the
# long-lived read token, as the quality step does. A clone that fails for any
# other reason fails the fallback too, so the workflow still goes red.
clone:
  git:
    image: woodpeckerci/plugin-git
    failure: ignore

steps:
  - name: clone-fallback
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
    commands:
      - |
        set -eu
        if git rev-parse --verify -q HEAD >/dev/null 2>&1; then
          exit 0
        fi
        echo "default clone left no checkout; cloning with the read token"
        URL=https://git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git
        git remote remove origin 2>/dev/null || true
        git remote add origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        if [ "$CI_PIPELINE_EVENT" = pull_request ]; then
          git fetch --no-tags origin "+$CI_COMMIT_REF"
        else
          git fetch --tags origin "+$CI_COMMIT_SHA"
        fi
        git checkout -qf "$CI_COMMIT_SHA"
        git remote set-url origin "$URL"
        git log --oneline -1

  - name: check
    image: bash
    commands:
      - |
        set -euo pipefail
        # Keychain-free DOCKER_CONFIG so the Docker Hub pull never touches the
        # credential helper.
        export DOCKER_CONFIG="$(mktemp -d)"
        echo '{}' > "$DOCKER_CONFIG/config.json"
        ./deploy/vector/check.sh

  - name: deploy-k3s1
    image: bash
    when:
      - event: [push, manual]
    environment:
      HOST: root@k3s1.nijmegen.wiebe.xyz
      OVERLAY: k3s1
      SOPS_AGE_KEY:
        from_secret: sops_age_key_testing
    commands: &deploy
      - |
        set -euo pipefail
        SSH="ssh -o StrictHostKeyChecking=no"
        $SSH "$HOST" "rm -rf /tmp/vector-deploy && mkdir -p /tmp/vector-deploy"
        scp -o StrictHostKeyChecking=no -r deploy/vector/k8s "$HOST:/tmp/vector-deploy/k8s"
        # rbac.yaml holds the namespace, which the secret needs first.
        $SSH "$HOST" "kubectl apply -f /tmp/vector-deploy/k8s/base/rbac.yaml"
        sops -d "deploy/vector/k8s/$OVERLAY/secret.yaml" | $SSH "$HOST" "kubectl apply -f -"
        # The config map name carries a content hash, so a config change rolls
        # the pods by itself; the restart picks up a rotated key.
        $SSH "$HOST" "
          set -euo pipefail
          kubectl apply -k /tmp/vector-deploy/k8s/$OVERLAY
          kubectl -n vector rollout restart daemonset/vector
          kubectl -n vector rollout status daemonset/vector --timeout=300s
        "

  - name: deploy-layer7
    image: bash
    when:
      - event: [push, manual]
    environment:
      HOST: deployer@layer7.wiebe.xyz
      OVERLAY: layer7
      SOPS_AGE_KEY:
        from_secret: sops_age_key_production
    commands: *deploy
