# Build + deploy to testing on every push to main.
# Ported from .github/workflows/build-and-test.yml. Mac Mini build agent (local
# backend): cross-builds amd64 via binfmt, SSHes to k3s1 with the host's keys.
# NB: local backend runs each `commands` entry in its own shell (only exported
# env carries over), so each step keeps its logic in ONE block.
#
# `depends_on: ci` is load-bearing, not tidiness. On a push to main, ci,
# build-and-test and binary-release are sibling workflows of ONE pipeline and
# would otherwise all start at once — so this workflow used to build images and
# roll them out to bugbarn-testing in parallel with the test suite, red or
# green, and the testing environment could be running a commit that never
# passed. binary-release got the same one-line dependency in #50; this is the
# other half of it.
when:
  - event: push
    branch: main
  - event: manual

depends_on:
  - ci

labels:
  type: build

# Clone with git tracing (#202). The clone step intermittently fails with
# "could not read Username ... Device not configured". GIT_TRACE shows which git
# binary runs, GIT_TRACE_CURL shows whether the fetch sent an Authorization
# header after the 401. GIT_TRACE_REDACT stays at its default (on), so
# credentials are redacted; request and response bodies are not traced.
clone:
  git:
    image: woodpeckerci/plugin-git
    environment:
      GIT_TRACE: "1"
      GIT_TRACE_CURL: "1"
      GIT_TRACE_CURL_NO_DATA: "1"

steps:
  - name: build-images
    image: bash
    environment:
      GHCR_USER: webwiebe
      GHCR_TOKEN:
        from_secret: ghcr_token
      SERVICE_IMAGE: ghcr.io/webwiebe/bugbarn/service
      WEB_IMAGE: ghcr.io/webwiebe/bugbarn/web
    commands:
      - |
        set -euo pipefail
        DOCKER_CONFIG_DIR="$(mktemp -d)"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')" > "$DOCKER_CONFIG_DIR/config.json"
        export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
        docker buildx build --platform linux/amd64 --push --build-arg COMMIT="$CI_COMMIT_SHA" --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -f deploy/docker/service.Dockerfile -t "$SERVICE_IMAGE:$CI_COMMIT_SHA" .
        docker buildx build --platform linux/amd64 --push -f deploy/docker/web.Dockerfile -t "$WEB_IMAGE:$CI_COMMIT_SHA" .

  - name: deploy-testing
    image: bash
    environment:
      SERVICE_IMAGE: ghcr.io/webwiebe/bugbarn/service
      WEB_IMAGE: ghcr.io/webwiebe/bugbarn/web
      K3S_HOST: k3s1.nijmegen.wiebe.xyz
      K3S_USER: root
      NAMESPACE: bugbarn-testing
      SOPS_AGE_KEY:
        from_secret: sops_age_key_testing
      GHCR_PULL_PAT:
        from_secret: ghcr_pull_pat
      BUGBARN_API_KEY:
        from_secret: bugbarn_api_key
      BUGBARN_ENDPOINT: https://bugbarn.wiebe.xyz
    commands:
      - |
        set -euo pipefail
        SSH="ssh -o StrictHostKeyChecking=no"
        # The pods report this as their version (GET /api/v1/version).
        VERSION="main-$(echo ${CI_COMMIT_SHA} | cut -c1-7)"
        sed -i.bak "s/__VERSION__/$VERSION/g" deploy/k8s/testing/kustomization.yaml
        rm -f deploy/k8s/testing/kustomization.yaml.bak
        $SSH "$K3S_USER@$K3S_HOST" "rm -rf /tmp/bugbarn-deploy && mkdir -p /tmp/bugbarn-deploy"
        scp -o StrictHostKeyChecking=no -r deploy "$K3S_USER@$K3S_HOST:/tmp/bugbarn-deploy/deploy"
        $SSH "$K3S_USER@$K3S_HOST" "kubectl apply -f /tmp/bugbarn-deploy/deploy/k8s/testing/namespace.yaml"
        sops -d deploy/k8s/testing/secret.yaml | $SSH "$K3S_USER@$K3S_HOST" "kubectl apply -f -"
        $SSH "$K3S_USER@$K3S_HOST" "kubectl create secret docker-registry ghcr-secret --docker-server=ghcr.io --docker-username='webwiebe' --docker-password='$GHCR_PULL_PAT' --namespace=$NAMESPACE --dry-run=client -o yaml | kubectl apply -f -"
        $SSH "$K3S_USER@$K3S_HOST" "
          set -euo pipefail
          kubectl apply -k /tmp/bugbarn-deploy/deploy/k8s/testing
          kubectl -n $NAMESPACE set image deployment/bugbarn bugbarn=$SERVICE_IMAGE:$CI_COMMIT_SHA
          kubectl -n $NAMESPACE set image deployment/bugbarn-web bugbarn-web=$WEB_IMAGE:$CI_COMMIT_SHA
          kubectl -n $NAMESPACE rollout status deployment/bugbarn --timeout=180s
          kubectl -n $NAMESPACE rollout status deployment/bugbarn-web --timeout=180s
          # Smoke: the pods report the version and commit that were deployed.
          sh /tmp/bugbarn-deploy/deploy/scripts/assert-version.sh $NAMESPACE deploy/bugbarn bugbarn $VERSION $CI_COMMIT_SHA
        "
        curl -sf -X POST "$BUGBARN_ENDPOINT/api/v1/releases" \
          -H "Content-Type: application/json" \
          -H "X-BugBarn-Api-Key: $BUGBARN_API_KEY" \
          -H "X-BugBarn-Project: bugbarn-service" \
          -d "{\"name\":\"$(echo ${CI_COMMIT_SHA} | cut -c1-7)\",\"environment\":\"testing\",\"version\":\"${CI_COMMIT_SHA}\",\"url\":\"${CI_REPO_URL}/commit/${CI_COMMIT_SHA}\",\"notes\":\"Deployed by Woodpecker #${CI_PIPELINE_NUMBER}\"}" \
          || echo "WARN: BugBarn release marker failed"

  # Browser smoke of the deployed dashboard: headless Chromium signs in, opens
  # the main views and fails on any console error, failed request or view that
  # does not render (web/e2e/deploy-smoke.spec.ts). It runs here, after the
  # rollout, and not in PR CI. Needs the testing admin login as the Woodpecker
  # secrets bugbarn_testing_admin_user / bugbarn_testing_admin_password.
  - name: smoke-testing
    image: bash
    depends_on: [deploy-testing]
    environment:
      SOPS_AGE_KEY:
        from_secret: sops_age_key_testing
      BUGBARN_SMOKE_USER:
        from_secret: bugbarn_testing_admin_user
      BUGBARN_SMOKE_PASSWORD:
        from_secret: bugbarn_testing_admin_password
      BUGBARN_SMOKE_URL: https://bugbarn.test.wiebe.xyz/app/
    commands:
      - |
        set -euo pipefail
        BUGBARN_SMOKE_API_KEY="$(sops -d --extract '["stringData"]["BUGBARN_API_KEY"]' deploy/k8s/testing/secret.yaml)"
        export BUGBARN_SMOKE_API_KEY
        cd web
        . "$CI_WORKSPACE/scripts/use-pnpm.sh"
        pnpm install --frozen-lockfile
        pnpm exec playwright install chromium
        pnpm run smoke:deploy
