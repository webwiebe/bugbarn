# OOMKilled watcher deploy (issue #266): on a version tag, once `release` has put
# the semver image in GHCR, roll the watcher out to k3s1 and layer7. A red run
# here never blocks production: deploy-production depends on `release` alone.
# NB: local backend = one shell per `commands` entry, and Woodpecker pre-
# substitutes braced variables; so each step is ONE block and all vars use $VAR
# (no braces). Avoid brace-vars even in comments, Woodpecker parses them.
when:
  - event: tag
    ref: refs/tags/v*

depends_on:
  - release

labels:
  type: build

clone:
  git:
    image: woodpeckerci/plugin-git
    failure: ignore

steps:
  - name: clone-fallback
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
    commands:
      - |
        set -eu
        if git rev-parse --verify -q HEAD >/dev/null 2>&1; then
          exit 0
        fi
        echo "default clone left no checkout; cloning with the read token"
        URL=https://git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git
        git remote remove origin 2>/dev/null || true
        git remote add origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        if [ "$CI_PIPELINE_EVENT" = pull_request ]; then
          git fetch --no-tags origin "+$CI_COMMIT_REF"
        else
          git fetch --tags origin "+$CI_COMMIT_SHA"
        fi
        git checkout -qf "$CI_COMMIT_SHA"
        git remote set-url origin "$URL"
        git log --oneline -1

  - name: preflight
    image: bash
    when:
      - event: tag
    environment:
      GHCR_USER: webwiebe
      GHCR_TOKEN:
        from_secret: ghcr_token
      SERVICE_IMAGE: ghcr.io/webwiebe/bugbarn/service
    commands:
      - |
        set -euo pipefail
        VERSION="$CI_COMMIT_TAG"
        test -n "$VERSION" || { echo "ERROR: no tag on this pipeline"; exit 1; }
        DOCKER_CONFIG_DIR="$(mktemp -d)"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')" > "$DOCKER_CONFIG_DIR/config.json"
        export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
        DIGEST="$(docker buildx imagetools inspect "$SERVICE_IMAGE:$VERSION" --format '{{.Manifest.Digest}}')"
        case "$DIGEST" in sha256:*) ;; *) echo "ERROR: no digest for $VERSION"; exit 1;; esac
        printf 'SERVICE_DIGEST=%s\n' "$DIGEST" > .digests
        echo "Verified $VERSION service@$DIGEST"

  - name: deploy-k3s1
    image: bash
    when:
      - event: tag
    environment:
      HOST: root@k3s1.nijmegen.wiebe.xyz
      OVERLAY: k3s1
      SOPS_AGE_KEY:
        from_secret: sops_age_key_testing
      GHCR_PULL_PAT:
        from_secret: ghcr_pull_pat
    commands: &deploy
      - |
        set -euo pipefail
        . ./.digests
        # No ingest key committed for this overlay yet (bugbarn#267): skip the
        # deploy instead of failing every release. The step goes live in the
        # first tag after the SOPS secret.yaml lands.
        if [ ! -f "deploy/oomwatch/k8s/$OVERLAY/secret.yaml" ]; then
          echo "oomwatch deploy skipped on $OVERLAY: deploy/oomwatch/k8s/$OVERLAY/secret.yaml is not committed (waiting on the ingest key, bugbarn#267)"
          exit 0
        fi
        SSH="ssh -o StrictHostKeyChecking=no"
        # Pin the release digest so the pod never runs the :local placeholder.
        sed -i.bak "s/newTag: local/digest: $SERVICE_DIGEST/" deploy/oomwatch/k8s/base/kustomization.yaml
        rm -f deploy/oomwatch/k8s/base/kustomization.yaml.bak
        $SSH "$HOST" "rm -rf /tmp/oomwatch-deploy && mkdir -p /tmp/oomwatch-deploy"
        scp -o StrictHostKeyChecking=no -r deploy/oomwatch/k8s "$HOST:/tmp/oomwatch-deploy/k8s"
        # rbac.yaml holds the namespace, which the secrets need first.
        $SSH "$HOST" "kubectl apply -f /tmp/oomwatch-deploy/k8s/base/rbac.yaml"
        sops -d "deploy/oomwatch/k8s/$OVERLAY/secret.yaml" | $SSH "$HOST" "kubectl apply -f -"
        $SSH "$HOST" "kubectl create secret docker-registry ghcr-secret --docker-server=ghcr.io --docker-username='webwiebe' --docker-password='$GHCR_PULL_PAT' --namespace=oomwatch --dry-run=client -o yaml | kubectl apply -f -"
        $SSH "$HOST" "
          set -euo pipefail
          if kubectl kustomize /tmp/oomwatch-deploy/k8s/$OVERLAY | grep -n 'image: .*:local'; then
            echo 'ERROR: a :local image is left in the rendered manifests'
            exit 1
          fi
          kubectl apply -k /tmp/oomwatch-deploy/k8s/$OVERLAY
          kubectl -n oomwatch rollout restart deployment/oomwatch
          kubectl -n oomwatch rollout status deployment/oomwatch --timeout=180s
        "

  - name: deploy-layer7
    image: bash
    when:
      - event: tag
    environment:
      HOST: deployer@layer7.wiebe.xyz
      OVERLAY: layer7
      SOPS_AGE_KEY:
        from_secret: sops_age_key_production
      GHCR_PULL_PAT:
        from_secret: ghcr_pull_pat
    commands: *deploy
