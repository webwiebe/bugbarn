# GHCR prune: delete bugbarn container versions older than a week, so the
# service/web/buildcache packages stop filling the account's shared storage
# quota. Runs daily from the `ghcr-prune` Woodpecker cron.
# scripts/ghcr-prune.sh documents what is kept. The images running in testing,
# staging and production are read from the clusters first and always kept; if
# that read fails, the step fails before anything is deleted.
# NB: local backend = one shell per `commands` entry, and Woodpecker pre-
# substitutes braced variables; so the step is ONE block and all vars use $VAR.
when:
  - event: cron
    cron: ghcr-prune

labels:
  type: build

# The default clone uses the token Woodpecker baked in when it created the
# pipeline, and a cron pipeline can wait in the queue past that token's one hour
# life (#202: pipeline 757 created 04:00, cloned 13:49, 401). `clone-fallback`
# then clones with the long-lived read token, as in the other workflows. When
# that fails too, `prune` is skipped and nothing is deleted.
# gitea_read_token must allow the `cron` event for this workflow to start.
clone:
  git:
    image: woodpeckerci/plugin-git
    failure: ignore

steps:
  - name: clone-fallback
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
    commands:
      - |
        set -eu
        if git rev-parse --verify -q HEAD >/dev/null 2>&1; then
          exit 0
        fi
        echo "default clone left no checkout; cloning with the read token"
        URL=https://git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git
        git remote remove origin 2>/dev/null || true
        git remote add origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        git fetch --tags origin "+$CI_COMMIT_SHA"
        git checkout -qf "$CI_COMMIT_SHA"
        git remote set-url origin "$URL"
        git log --oneline -1

  - name: prune
    image: bash
    environment:
      GHCR_TOKEN:
        from_secret: ghcr_prune_token
      KEEP_DAYS: "7"
      KEEP_RELEASES: "3"
      MAX_DELETE: "300"
    commands:
      - |
        set -euo pipefail
        SSH="ssh -o StrictHostKeyChecking=no -o BatchMode=yes"
        COLS='{range .items[*]}{.spec.template.spec.containers[*].image} {.spec.jobTemplate.spec.template.spec.containers[*].image}{"\n"}{end}'
        export PROTECT_FILE="$(mktemp)"
        # k3s1 hosts testing and staging, layer7 hosts production.
        $SSH root@k3s1.nijmegen.wiebe.xyz "kubectl get deploy,statefulset,daemonset,cronjob -A -o jsonpath='$COLS'" >> "$PROTECT_FILE"
        $SSH deployer@layer7.wiebe.xyz "kubectl get deploy,statefulset,daemonset,cronjob -A -o jsonpath='$COLS'" >> "$PROTECT_FILE"
        echo "Running bugbarn images (kept):"
        tr ' ' '\n' < "$PROTECT_FILE" | grep 'ghcr.io/webwiebe/bugbarn/' | sort -u
        ./scripts/ghcr-prune.sh
