# CI — lint/build/test gates on every push to main and every PR.
# Ported from .github/workflows/ci.yml. Runs on the Mac Mini build agent
# (local backend): host docker/buildx, node, python, php and the persistent
# bugbarn-ci buildx builder all work as on the GitHub self-hosted runner.
#
# NB: the local backend runs each `commands` ENTRY in its own shell (only
# exported env carries over), so each step keeps all its logic in ONE block.
when:
  - event: push
    branch: main
  - event: pull_request
  - event: manual

labels:
  type: build

steps:
  - name: spec
    image: bash
    commands:
      - |
        set -euo pipefail
        python3 -m venv .ci-venv
        . .ci-venv/bin/activate
        python -m pip install PyYAML
        make spec-check

  # Go build/vet/test inside BuildKit, registry-cached via GHCR (shared across
  # machines). Native arm64.
  - name: go
    image: bash
    environment:
      GHCR_USER: webwiebe
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        set -euo pipefail
        # Keychain-free DOCKER_CONFIG: inline ghcr.io auth, no credsStore.
        DOCKER_CONFIG_DIR="$(mktemp -d)"
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$(printf '%s:%s' "$GHCR_USER" "$GHCR_TOKEN" | base64 | tr -d '\n')" > "$DOCKER_CONFIG_DIR/config.json"
        export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
        # DOCKER_CONFIG is throwaway; point buildx at the host's builder store so
        # the bugbarn-ci docker-container builder is reused across runs.
        export BUILDX_CONFIG="$HOME/.docker/buildx"
        # Ensure a working docker-container builder: bootstrap it if it exists but
        # is stopped; recreate if its container is gone/wedged.
        docker buildx inspect bugbarn-ci --bootstrap >/dev/null 2>&1 || { docker buildx rm bugbarn-ci >/dev/null 2>&1 || true; docker buildx create --name bugbarn-ci --driver docker-container --bootstrap >/dev/null; }
        CACHE_REF="ghcr.io/webwiebe/bugbarn/buildcache"
        docker buildx build \
          --builder bugbarn-ci \
          --platform linux/arm64 \
          --target test \
          -f deploy/docker/service.Dockerfile \
          --cache-from "type=registry,ref=$CACHE_REF" \
          --cache-to "type=registry,ref=$CACHE_REF,mode=max" \
          --output type=cacheonly \
          .

  # `npm run lint` and `npm run build` are deliberately NOT --if-present. A
  # missing script used to read exactly like a clean package: sdks/typescript
  # had no lint script at all and was silently never linted. Every package
  # below now has both, and a package that loses one fails the build.
  - name: node-web
    image: bash
    commands:
      - |
        set -euo pipefail
        cd web
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run lint
        npm run test
        npm run build
        npx --yes jscpd@latest .
        cd ..
        # TypeScript size/complexity soak. Lives here, not in the quality step,
        # because it needs the node_modules this step just installed.
        sh scripts/check-ts-budget.sh

  - name: node-site
    image: bash
    commands:
      - |
        set -euo pipefail
        cd site
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run lint
        # site is the one package with no test script: it is an Astro content
        # site with no runtime logic, and `npm run lint` (astro check) plus the
        # build are its whole check surface. Stated here rather than hidden
        # behind --if-present.
        npm run build

  - name: node-sdk-ts
    image: bash
    commands:
      - |
        set -euo pipefail
        cd sdks/typescript
        if [ -f package-lock.json ]; then npm ci; else npm install; fi
        npm run lint
        npm run test
        npm run build

  - name: python
    image: bash
    commands:
      - |
        set -euo pipefail
        cd sdks/python
        python3 -m venv .ci-venv
        . .ci-venv/bin/activate
        python -m pip install --upgrade pip
        # Pin ruff: an unpinned install means a new ruff release changes what CI
        # enforces with no commit on our side. 0.16.0 shipped new defaults and
        # broke every build until sdks/python/pyproject.toml pinned the rule set.
        python -m pip install build pytest 'ruff==0.16.0'
        if [ -f pyproject.toml ]; then python -m pip install -e .; fi
        if find . \( -name 'test_*.py' -o -name '*_test.py' -o -path '*/tests/*.py' \) -print -quit | grep -q .; then PYTHONPATH=src python -m pytest; fi
        if find . -name '*.py' -print -quit | grep -q .; then python -m ruff check .; fi
        if [ -f pyproject.toml ]; then python -m build; fi

  # The PHP toolchain comes from a pinned container, not from the host. This
  # step used to `exit 0` when php or composer were missing — and neither is
  # installed on the build agent, so the PHP SDK had not been tested at all
  # while the step reported green. There is now no path through this step that
  # skips the tests: a missing docker fails it.
  - name: php
    image: bash
    commands:
      - |
        set -euo pipefail
        command -v docker >/dev/null 2>&1 || { echo "FAIL: docker is required to run the PHP SDK tests"; exit 1; }
        # Keychain-free DOCKER_CONFIG, for the same reason the go step above has
        # one. The agent's ~/.docker/config.json sets "credsStore": "desktop", so
        # docker shells out to docker-credential-desktop for every pull — even a
        # public image needing no auth at all. That helper lives inside
        # Docker.app and is not on this step's PATH, so the pull dies with
        # `error getting credentials ... executable file not found in $PATH`.
        #
        # It stayed hidden while composer:2.8 was in the agent's local image
        # cache: no pull, no credential lookup. The first run after the cache
        # lost the image failed (pipeline 258), which is why this looks like it
        # broke spontaneously. An empty config means no credsStore to consult;
        # composer:2.8 is public, so there is nothing to authenticate.
        DOCKER_CONFIG_DIR="$(mktemp -d)"
        printf '{}\n' > "$DOCKER_CONFIG_DIR/config.json"
        export DOCKER_CONFIG="$DOCKER_CONFIG_DIR"
        cd sdks/php
        docker run --rm -v "$(pwd):/app" -w /app composer:2.8 sh -c 'set -eu; composer install --no-interaction --prefer-dist; ./vendor/bin/phpunit'

  # Quality gates run directly on the host so golangci-lint can use full git
  # history for diff-mode and the coverage profile can escape.
  #
  # Every gate is a script in scripts/, called identically from here and from
  # the GitHub ci.yml mirror. They used to be inline shell duplicated across
  # both files, which is how the two pipelines ended up pinning different
  # golangci-lint versions and therefore enforcing different linters.
  - name: quality
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
      # The build agents share $HOME across machines; Go caches on that share
      # have served truncated module files (typecheck "EOF" failures) even
      # after re-download + go mod verify passed. Keep every Go/lint cache on
      # the machine-local /tmp instead.
      GOMODCACHE: /tmp/bugbarn-ci/gomodcache
      GOCACHE: /tmp/bugbarn-ci/gocache
      GOLANGCI_LINT_CACHE: /tmp/bugbarn-ci/golangci-lint
    commands:
      - |
        set -euo pipefail
        sh scripts/heal-go-modcache.sh
        # The gates' own tests run first: a gate that has stopped failing must
        # be reported before the gates it protects are trusted.
        sh scripts/gates_test.sh
        sh scripts/check-file-length.sh
        # Create the origin/* remote-tracking refs (a plain `git fetch origin main`
        # only updates FETCH_HEAD), with enough depth for the diff base. Without
        # this golangci-lint's diff mode treats the whole tree as new. (A colon
        # refspec breaks Woodpecker's variable parser, so set the fetch refspec
        # in config.) Fetch over an authenticated URL — Apple git here won't use
        # ~/.netrc and the osxkeychain helper is unreachable headless. Token is a
        # masked Woodpecker secret.
        git remote set-url origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
        git fetch --no-tags --unshallow origin || git fetch --no-tags --depth=2000 origin
        # Full-tree ratchet on every event plus a diff-scoped run on PRs. The
        # old step ran only the diff-scoped half, unconditionally, so on a push
        # to main it compared main to itself and passed without reading a line.
        sh scripts/check-go-lint.sh
        sh scripts/check-go-soak.sh
        sh scripts/check-coverage.sh
        npx --yes jscpd@latest .
