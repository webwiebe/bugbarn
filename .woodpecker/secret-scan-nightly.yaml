# Nightly full-history secret scan, from the `secret-scan-nightly` Woodpecker cron.
# A push to main scans only the commits it added (ci.yaml); this run scans every
# commit reachable from main, so a commit a push scan missed is found within a day.
# Never on a pull request or a push. Enforced like the ci step: a finding or growth of
# .gitleaksignore fails the run, and so does a scan that could not run.
when:
  - event: cron
    cron: secret-scan-nightly

labels:
  type: build

# See ghcr-prune.yaml: a cron pipeline can wait in the queue past the life of the
# clone token. gitea_read_token must allow the `cron` event.
clone:
  git:
    image: woodpeckerci/plugin-git
    failure: ignore

steps:
  - name: clone-fallback
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
    commands:
      - |
        set -eu
        if git rev-parse --verify -q HEAD >/dev/null 2>&1; then
          exit 0
        fi
        echo "default clone left no checkout; cloning with the read token"
        URL=https://git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git
        git remote remove origin 2>/dev/null || true
        git remote add origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        git fetch --tags origin "+$CI_COMMIT_SHA"
        git checkout -qf "$CI_COMMIT_SHA"
        git remote set-url origin "$URL"
        git log --oneline -1

  - name: secret-scan-history
    image: bash
    environment:
      GITEA_READ_TOKEN:
        from_secret: gitea_read_token
      SECRET_SCAN_MODE: enforce
      SECRET_SCAN_MIN_COMMITS: "400"
    commands:
      - |
        set -euo pipefail
        bash scripts/tests/secret-scan.test.sh
        git remote set-url origin "https://wiebe:$GITEA_READ_TOKEN@git.nijmegen.wiebe.xyz/webwiebe/bugbarn.git"
        git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --no-tags --unshallow origin || git fetch --no-tags --depth=2000 origin
        fi
        bash scripts/secret-scan.sh history
